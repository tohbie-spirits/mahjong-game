<body data-theme="dark">

  <!-- Skip link for keyboard/screen-reader users; target added once the main app region exists. -->
  <a class="skip-link" href="#app-root">Skip to game</a>

  <!-- Root mount point. All screens (Main Menu, Game Screen, etc.) are rendered into this
       container by the UI layer (src/ui/) starting in Task 52 onward. Nothing is rendered
       here directly by index.html itself. -->
  <div id="app-root" role="application" aria-label="Mahjong"></div>

  <!-- Tasks 110–111: Sound / Fullscreen controls, on every screen (outside #app-root so screen changes keep them). -->
  <div id="app-toolbar"></div>

  <!-- Shown only if the app fails to boot (e.g. JavaScript disabled). Real boot-failure
       handling is wired up in main.js; this is the no-JS fallback. -->
  <noscript>
    <div class="noscript-notice">
      <p>Mahjong requires JavaScript to run. Please enable JavaScript in your browser settings and reload this page.</p>
    </div>
  </noscript>

  <!-- Single module entry point. Everything else is imported from here. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
